name: Publish Arshad Finance APK release

on:
  workflow_run:
    workflows: ["Build Arshad Finance APK"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK from the completed build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id }}"
          if [[ -z "$RUN_ID" ]]; then
            RUN_ID="$(gh run list --repo mafushibrand/Arshad-Finance-and-Trader --workflow build-apk.yml --limit 10 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId' | head -n 1)"
          fi
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --repo mafushibrand/Arshad-Finance-and-Trader --name ArshadFinance-4.9.11-APK --dir dist
          test -s dist/ArshadFinance-4.9.11.apk
          (cd dist && sha256sum -c SHA256SUMS.txt)
          file dist/ArshadFinance-4.9.11.apk

      - name: Publish public GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum dist/ArshadFinance-4.9.11.apk | awk '{print $1}')"
          if gh release view v4.9.11 --repo mafushibrand/Arshad-Finance-and-Trader >/dev/null 2>&1; then
            gh release upload v4.9.11 dist/ArshadFinance-4.9.11.apk --clobber \
              --repo mafushibrand/Arshad-Finance-and-Trader
            gh release edit v4.9.11 --repo mafushibrand/Arshad-Finance-and-Trader \
              --title "Arshad Finance 4.9.11" --notes "Verified update-compatible Khata and Roznamcha build. SHA-256: $SHA"
          else
            gh release create v4.9.11 dist/ArshadFinance-4.9.11.apk \
              --repo mafushibrand/Arshad-Finance-and-Trader \
              --title "Arshad Finance 4.9.11" \
              --notes "Verified APK build. SHA-256: $SHA"
          fi
