name: Build Arshad Finance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q 'ArshadFinance-4.6.0-category-demo-source(1).zip' -d source
          PROJECT_DIR="$(find source -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"
          grep -RInE 'compileSdk|targetSdk|distributionUrl' "$PROJECT_DIR" --include='*.gradle.kts' --include='gradle-wrapper.properties' --include='libs.versions.toml' || true

      - name: Archive extracted source for complete catalogue implementation
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          zip -qr "$GITHUB_WORKSPACE/extracted-source-review.zip" app/src/main/java app/src/main/res app/src/test app/build.gradle.kts settings.gradle.kts gradle/libs.versions.toml 2>/dev/null || true

      - name: Upload extracted source review
        uses: actions/upload-artifact@v4
        with:
          name: ArshadFinance-extracted-source-review
          path: extracted-source-review.zip
          if-no-files-found: error
          retention-days: 7

      - name: Inspect home navigation and business categories
        shell: bash
        run: |
          set -euo pipefail
          echo '--- BusinessHomeScreen category and service references ---'
          grep -n -i -C 3 -E 'service|category|FinanceTab|bottom|NavigationBarItem' "$PROJECT_DIR/app/src/main/java/com/example/ui/screens/BusinessHomeScreen.kt" || true
          echo '--- MainActivity navigation references ---'
          grep -n -i -C 3 -E 'FinanceTab|service|NavigationBarItem|bottomNavigation|NavigationBar' "$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt" || true
          echo '--- Navigation source files ---'
          grep -RIl 'enum class FinanceTab\|sealed.*FinanceTab\|FinanceTab.SERVICES' "$PROJECT_DIR/app/src/main/java" || true

      - name: Apply stock safety and unified POS catalogue fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-functional-fixes.py" "$PROJECT_DIR"

      - name: Allow service items in held POS carts
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-service-draft-fix.py" "$PROJECT_DIR"

      - name: Add stock and service POS regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-stock-pos-regression-tests.py" "$PROJECT_DIR"

      - name: Fix POS checkout language parameter
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/fix-pos-checkout-language-param.py" "$PROJECT_DIR"

      - name: Apply Urdu and English dashboard and receipt labels
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-language-fixes.py" "$PROJECT_DIR"

      - name: Correct stale and mixed-language app version labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1]) / "app/src/main/java/com/example/ui/screens/SettingsScreen.kt"
          s = p.read_text(encoding="utf-8")
          pairs = [
            ('text = "APP VERSION & APK UPDATE (ورژن 2.7.0)"',
             'text = if (isUrdu) "ایپ ورژن اور APK اپ ڈیٹ" else "APP VERSION & APK UPDATE"'),
            ('text = "Arshad Finance V3.2.0"', 'text = "Arshad Finance"'),
            ('text = "LATEST ✓"', 'text = if (isUrdu) "تازہ ترین ✓" else "LATEST ✓"'),
            ('text = "Build 33 • Login, Mode Switcher, FBR Statements & Plans"',
             'text = if (isUrdu) "لاگ اِن، بزنس موڈ، FBR اسٹیٹمنٹ اور پلانز" else "Login, Business Modes, FBR Statements & Plans"'),
            ('text = "تازہ ترین اپ ڈیٹ (What\'s New in V3.2.0):"',
             'text = if (isUrdu) "نئی تبدیلیاں" else "What\'s New"'),
            ('text = "Download APK / Update Guide (تازہ ترین APK ڈاؤنلوڈ کریں)"',
             'text = if (isUrdu) "تازہ ترین APK ڈاؤنلوڈ / اپ ڈیٹ گائیڈ" else "Download APK / Update Guide"'),
            ('text = "Arshad Finance & Traders V2.7.0"', 'text = "Arshad Finance & Traders"'),
            ('text = "All-in-One POS, Billing, Multi-Role & Subscription Khata"',
             'text = if (isUrdu) "مکمل POS، بلنگ، متعدد صارفین اور سبسکرپشن کھاتہ" else "All-in-One POS, Billing, Multi-Role & Subscription Khata"'),
            ('Text(if (isUrdu) "تازہ ترین APK ڈاؤنلوڈ (ورژن 3.3.0)" else "Download Latest Version APK (v3.3.0)"',
             'Text(if (isUrdu) "تازہ ترین APK ڈاؤنلوڈ" else "Download Latest Version APK"')
          ]
          for old, new in pairs:
              if old not in s:
                  if new in s:
                      continue
                  raise SystemExit("Expected old version label not found: " + old[:75])
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          print("Removed obsolete version labels and localized settings labels.")
          PY

      - name: Apply selected-language thermal receipt preview
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-thermal-preview-language.py" "$PROJECT_DIR"

      - name: Fix Compose ListTile trailing-lambda parameter order
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/java/com/example/ui/screens/PremiumInventoryScreen.kt" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          old = """internal fun ListTile(title: String, subtitle: String, icon: ImageVector, trailing: String = "",
            tint: Color = Mint, click: () -> Unit = {}, controls: @Composable RowScope.() -> Unit = {},
            leadingEmoji: String = "") {"""
          new = """internal fun ListTile(title: String, subtitle: String, icon: ImageVector, trailing: String = "",
            tint: Color = Mint, click: () -> Unit = {}, leadingEmoji: String = "",
            controls: @Composable RowScope.() -> Unit = {}) {"""
          if old not in source:
              if new in source:
                  print("ListTile signature already fixed")
              else:
                  raise SystemExit("Expected ListTile signature not found; refusing unsafe patch")
          else:
              path.write_text(source.replace(old, new, 1))
              print("Fixed ListTile parameter order")
          PY

      - name: Give standalone APK a fresh package identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          replacements = {
              'applicationId = "com.aistudio.arshadfinance.v2stock"': 'applicationId = "com.aistudio.arshadfinance.v2stock.standalone5"',
              'versionCode = 45': 'versionCode = 60',
              'versionName = "4.6.0-plans"': 'versionName = "4.9.0"',
              'manifestPlaceholders["appLabel"] = "@string/app_name"': 'manifestPlaceholders["appLabel"] = "Arshad Finance"',
          }
          for before, after in replacements.items():
              if before not in s:
                  raise SystemExit(f"Expected build setting not found: {before}")
              s = s.replace(before, after, 1)
          p.write_text(s)
          print("Configured fresh standalone5 package, version 4.9.0")
          PY

      - name: Fix trial header and demo catalogue test failures
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-test-failure-fixes.py" "$PROJECT_DIR"

      - name: Add bilingual auto-sliding home promotional banners
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-home-showcase.py" "$PROJECT_DIR"

      - name: Add editable product, service, business logo and banner images
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-multi-business-customization.py" "$PROJECT_DIR"

      - name: Bundle HD demo photos for promotional slider
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/add-demo-promo-assets.py" "$PROJECT_DIR"

      - name: Build dynamic storefront and owner-managed catalogue
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-dynamic-home.py" "$PROJECT_DIR"

      - name: Add ten storefront departments and remove duplicate Home shortcuts
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-storefront-departments.py" "$PROJECT_DIR"

      - name: Fix demo storefront products, category CRUD and Finance More tab
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-catalogue-crud-more.py" "$PROJECT_DIR"

      - name: Populate all retail departments with HD demo products
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-demo-storefront-catalog.py" "$PROJECT_DIR"

      - name: Add Home slider management, special offers, demo toggle and Catalog-only Services
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-home-controls.py" "$PROJECT_DIR"

      - name: Move slider controls to More and add unlimited image-first slide management
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-promo-manager.py" "$PROJECT_DIR"

      - name: Correct Home slider and Urdu promo regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/fix-home-promo-regression-tests.py" "$PROJECT_DIR"

      - name: Upgrade Khata ledger and add global seasonal app themes
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-khata-theme-upgrade.py" "$PROJECT_DIR"

      - name: Add customer profile photos and Khata transaction attachments
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-khata-attachments.py" "$PROJECT_DIR"

      - name: Apply full app theme and enhanced Khata profiles
        shell: bash
        run: |
          set -euo pipefail
          base64 -d "$GITHUB_WORKSPACE/scripts/apply-khata-theme-and-profile-v2.py.gz.b64" | gzip -dc > "$GITHUB_WORKSPACE/scripts/apply-khata-theme-and-profile-v2.py"
          python3 "$GITHUB_WORKSPACE/scripts/apply-khata-theme-and-profile-v2.py" "$PROJECT_DIR"
          python3 - "$PROJECT_DIR/app/src/main/java/com/example/ui/screens/PersonalKhataScreen.kt" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text()
          old='''  val context=LocalContext.current
            fun acceptGallery(uri:Uri?,set:(String)->Unit){if(uri!=null)runCatching{copyKhataPhoto(context,uri)}.onSuccess(set).onFailure{error=it.localizedMessage ?: "Photo could not be saved"}}
            val galleryPicker=rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()){uri->acceptGallery(uri){setProfilePhoto(it)}}'''
          new='''  val context=LocalContext.current
            var pendingOldPhoto by remember {mutableStateOf("")}
            fun setProfilePhoto(uri:String){if(personPhoto.isNotBlank() && personPhoto!=uri)pendingOldPhoto=personPhoto;personPhoto=uri}
            fun acceptGallery(uri:Uri?,set:(String)->Unit){if(uri!=null)runCatching{copyKhataPhoto(context,uri)}.onSuccess(set).onFailure{error=it.localizedMessage ?: "Photo could not be saved"}}
            val galleryPicker=rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()){uri->acceptGallery(uri){setProfilePhoto(it)}}'''
          if old in s:
              s=s.replace(old,new,1)
              s=s.replace('''  var pendingOldPhoto by remember {mutableStateOf("")}
            fun setProfilePhoto(uri:String){if(personPhoto.isNotBlank() && personPhoto!=uri)pendingOldPhoto=personPhoto;personPhoto=uri}
            fun done''','''  fun done''',1)
          elif s.find('fun setProfilePhoto') < s.find('val galleryPicker'):
              print("Khata profile photo callback order already fixed")
          else:
              raise SystemExit("Could not repair Khata photo callback declaration order")
          s=s.replace('newPerson=true;editingPerson="";name=""','newPerson=true;editingPerson="";pendingOldPhoto="";name=""')
          s=s.replace('personPhoto=avatar;editingPerson=person.id;error=""','personPhoto=avatar;editingPerson=person.id;pendingOldPhoto="";error=""')
          p.write_text(s)
          PY

      - name: Fix non-composable MaterialTheme references in generated source
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          p = root / "app/src/main/java/com/example/ui/components/BestForBusinessShowcase.kt"
          s = p.read_text(encoding="utf-8")
          fixes = {
              "textColor = MaterialTheme.colorScheme.onSurface,": "textColor = Color(0xFF172C24),",
              "bgGradientEnd = MaterialTheme.colorScheme.primary,": "bgGradientEnd = Color(0xFF166534),",
              "bgGradientStart = MaterialTheme.colorScheme.onSurfaceVariant,": "bgGradientStart = Color(0xFF64748B),",
              "bgGradientEnd = MaterialTheme.colorScheme.onSurfaceVariant,": "bgGradientEnd = Color(0xFF64748B),",
          }
          for old, new in fixes.items():
              s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")
          p = root / "app/src/main/java/com/example/ui/screens/PremiumInventoryScreen.kt"
          s = p.read_text(encoding="utf-8")
          s = s.replace("internal val Cream = MaterialTheme.colorScheme.surface", "internal val Cream = Color(0xFFFFFBF5)")
          s = s.replace("internal val Forest = MaterialTheme.colorScheme.primary", "internal val Forest = Color(0xFF166534)")
          p.write_text(s, encoding="utf-8")
          print("Replaced top-level non-composable MaterialTheme reads with stable palette constants.")
          PY

      - name: Update Khata design tests for attachment callbacks
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/test/java/com/example/AccessDesignTest.kt" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          s2 = s.replace("{_,_,_,_->},{_,_,_,_,_,_->}", "{_,_,_,_,_->},{_,_,_,_,_,_,_->}")
          if s2 == s:
              if "{_,_,_,_,_->},{_,_,_,_,_,_,_->}" not in s:
                  raise SystemExit("Expected AccessDesignTest callback arguments not found")
          else:
              s = s2
          p.write_text(s, encoding="utf-8")
          print("Updated PersonalKhataScreen test callbacks to include completion handlers.")
          PY

      - name: Add business Roznamcha cashbook with dated entries and Khata accent
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          core=root/"app/src/main/java/com/example/business/BusinessCore.kt"
          s=core.read_text(encoding="utf-8")
          marker="  private suspend fun audit(action: String, id: String, actor: String) {"
          method='''  suspend fun roznamchaEntry(amount: Double, income: Boolean, dateMillis: Long, note: String, accountId: Long, actor: String) = db.withTransaction {
            validMoney(amount)
            require(amount > 0.0) { "Enter a positive amount / درست رقم درج کریں" }
            require(note.isNotBlank()) { "Enter entry description / اندراج کی تفصیل درج کریں" }
            val account = db.financeDao().getAllAccountsList().firstOrNull { it.id == accountId }
              ?: error("Choose a valid cash account / درست کیش اکاؤنٹ منتخب کریں")
            val now = System.currentTimeMillis()
            db.financeDao().changeAccountBalance(account.id, if (income) amount else -amount)
            db.financeDao().insertTransaction(Transaction(
              title = if (income) "Roznamcha • Cash In" else "Roznamcha • Cash Out",
              amount = amount,
              type = if (income) TransactionType.INCOME else TransactionType.EXPENSE,
              category = "Roznamcha",
              icon = if (income) "💰" else "🧾",
              accountName = account.name,
              dateMillis = dateMillis,
              note = note.trim(),
              transactionRef = "ROZNAMCHA/${UUID.randomUUID()}",
              updatedAt = now,
              createdBy = actor
            ))
          }
'''
          if "suspend fun roznamchaEntry(" not in s:
              if marker not in s: raise SystemExit("BusinessCore audit insertion point missing")
              s=s.replace(marker,method+marker,1)
              core.write_text(s,encoding="utf-8")
          ui=root/"app/src/main/java/com/example/ui/screens/BusinessOperationsScreen.kt"
          s=ui.read_text(encoding="utf-8")
          s=s.replace('"JOB" to text("Jobs","جاب کارڈ"),','"ROZNAMCHA" to text("Roznamcha","روزنامچہ"),"JOB" to text("Jobs","جاب کارڈ"),',1)
          s=s.replace('section !in listOf("MOVEMENTS","AUDIT","UNITS","DEMO")','section !in listOf("MOVEMENTS","AUDIT","UNITS","DEMO")',1)
          s=s.replace('if(section=="PRODUCTION") text("Record production","پیداوار درج کریں") else text("Add ${sections[section]}","نیا ریکارڈ شامل کریں")','if(section=="PRODUCTION") text("Record production","پیداوار درج کریں") else if(section=="ROZNAMCHA") text("Add cash entry","نیا نقد اندراج") else text("Add ${sections[section]}","نیا ریکارڈ شامل کریں")',1)
          marker='''      "MOVEMENTS" -> {
'''
          branch='''      "ROZNAMCHA" -> {
        var period by remember { mutableStateOf("TODAY") }
        val all = state.transactions.filter { it.category == "Roznamcha" }.sortedByDescending { it.dateMillis }
        val today = SimpleDateFormat("yyyyMMdd",Locale.US).format(Date())
        val month = SimpleDateFormat("yyyyMM",Locale.US).format(Date())
        val rows = all.filter { tx ->
          val date=Date(tx.dateMillis)
          val inPeriod=when(period) {
            "TODAY" -> SimpleDateFormat("yyyyMMdd",Locale.US).format(date)==today
            "MONTH" -> SimpleDateFormat("yyyyMM",Locale.US).format(date)==month
            else -> true
          }
          inPeriod && (query.isBlank() || tx.title.contains(query,true) || tx.note.contains(query,true) || tx.accountName.contains(query,true))
        }
        val cashIn=rows.filter { it.type==TransactionType.INCOME }.sumOf { it.amount }
        val cashOut=rows.filter { it.type==TransactionType.EXPENSE }.sumOf { it.amount }
        item {
          Column(verticalArrangement=Arrangement.spacedBy(10.dp)) {
            Row(horizontalArrangement=Arrangement.spacedBy(8.dp)) {
              FilterChip(period=="TODAY",{period="TODAY"},label={Text(text("Today","آج"))})
              FilterChip(period=="MONTH",{period="MONTH"},label={Text(text("This month","اس ماہ"))})
              FilterChip(period=="ALL",{period="ALL"},label={Text(text("All entries","تمام اندراجات"))})
            }
            Row(horizontalArrangement=Arrangement.spacedBy(8.dp)) {
              Card(Modifier.weight(1f),colors=CardDefaults.cardColors(containerColor=MaterialTheme.colorScheme.primaryContainer)) {
                Column(Modifier.padding(12.dp)) { Text(text("Cash In","آمدن"),color=MaterialTheme.colorScheme.onPrimaryContainer);Text(state.money(cashIn),fontWeight=FontWeight.Bold,color=MaterialTheme.colorScheme.onPrimaryContainer) }
              }
              Card(Modifier.weight(1f),colors=CardDefaults.cardColors(containerColor=MaterialTheme.colorScheme.secondaryContainer)) {
                Column(Modifier.padding(12.dp)) { Text(text("Cash Out","خرچ"),color=MaterialTheme.colorScheme.onSecondaryContainer);Text(state.money(cashOut),fontWeight=FontWeight.Bold,color=MaterialTheme.colorScheme.onSecondaryContainer) }
              }
            }
            Card(colors=CardDefaults.cardColors(containerColor=MaterialTheme.colorScheme.tertiaryContainer)) {
              Row(Modifier.fillMaxWidth().padding(14.dp),horizontalArrangement=Arrangement.SpaceBetween) {
                Text(text("Net cash movement","خالص نقد فرق"),fontWeight=FontWeight.SemiBold)
                Text(state.money(cashIn-cashOut),fontWeight=FontWeight.Bold)
              }
            }
          }
        }
        if(rows.isEmpty()) item { EmptyList(text("No Roznamcha entries","روزنامچہ میں ابھی کوئی اندراج نہیں"),text("Add daily cash received or paid","روزانہ وصولی یا ادائیگی درج کریں"),Icons.Default.MenuBook) }
        items(rows,key={it.id}) { tx ->
          val incoming=tx.type==TransactionType.INCOME
          val date=SimpleDateFormat("dd MMM yyyy • hh:mm a",Locale.getDefault()).format(Date(tx.dateMillis))
          ListTile(if(incoming)text("Cash received","نقد وصولی") else text("Cash paid","نقد ادائیگی"),
            date+" • "+tx.accountName+"\n"+tx.note,Icons.Default.MenuBook,
            controls={Text((if(incoming)"+ " else "− ")+state.money(tx.amount),fontWeight=FontWeight.Bold,color=if(incoming)Color(0xFF0F766E) else Color(0xFFB45309))})
        }
      }
'''
          if '"ROZNAMCHA" -> {' not in s:
              if marker not in s: raise SystemExit("BusinessOperations MOVEMENTS branch missing")
              s=s.replace(marker,branch+marker,1)
          old='''  if(form && writable) OperationForm(section,state,onDismiss={form=false},save={title,party,amount,payload ->
    viewModel.businessAction({create(section,title,party,amount,payload,actor)}) {result(it)}
  },produce={id,qty,waste -> viewModel.businessAction({produce(id,qty,waste,actor)}) {result(it)}})
'''
          new='''  if(form && writable && section=="ROZNAMCHA") RoznamchaEntryForm(state,{form=false}) { amount,income,date,note,accountId ->
    viewModel.businessAction({roznamchaEntry(amount,income,date,note,accountId,actor)}) {result(it)}
  }
  else if(form && writable) OperationForm(section,state,onDismiss={form=false},save={title,party,amount,payload ->
    viewModel.businessAction({create(section,title,party,amount,payload,actor)}) {result(it)}
  },produce={id,qty,waste -> viewModel.businessAction({produce(id,qty,waste,actor)}) {result(it)}})
'''
          if old in s and 'RoznamchaEntryForm(state' not in s: s=s.replace(old,new,1)
          elif 'RoznamchaEntryForm(state' not in s: raise SystemExit("BusinessOperations form block missing")
          if 'private fun RoznamchaEntryForm' not in s:
              s += '''
          
          @Composable
          private fun RoznamchaEntryForm(state:FinanceUiState,dismiss:()->Unit,save:(Double,Boolean,Long,String,Long)->Unit) {
            val urdu=state.appLanguage==AppLanguage.URDU
            fun t(en:String,ur:String)=if(urdu)ur else en
            var incoming by remember { mutableStateOf(true) }
            var amount by remember { mutableStateOf("") }
            var note by remember { mutableStateOf("") }
            var dateText by remember { mutableStateOf(SimpleDateFormat("yyyy-MM-dd",Locale.US).format(Date())) }
            var accountId by remember { mutableStateOf(state.accounts.firstOrNull()?.id ?: 0L) }
            var error by remember { mutableStateOf("") }
            BusinessForm(t("Roznamcha entry","روزنامچہ اندراج"),t("Save entry","اندراج محفوظ کریں"),dismiss,{
              val value=amount.toDoubleOrNull()
              val date=runCatching { SimpleDateFormat("yyyy-MM-dd",Locale.US).apply { isLenient=false }.parse(dateText)?.time }.getOrNull()
              when {
                value==null || !value.isFinite() || value<=0 -> error=t("Enter a valid amount","درست رقم درج کریں")
                note.isBlank() -> error=t("Add a description for this entry","اس اندراج کی تفصیل لکھیں")
                date==null -> error=t("Use date format YYYY-MM-DD","تاریخ YYYY-MM-DD میں لکھیں")
                accountId<=0 -> error=t("Create or select a cash account first","پہلے کیش اکاؤنٹ بنائیں یا منتخب کریں")
                else -> save(value,incoming,date,note,accountId)
              }
            }) {
              Row(horizontalArrangement=Arrangement.spacedBy(8.dp)) {
                FilterChip(incoming,{incoming=true},label={Text(t("Cash In / وصولی","نقد آمدن / وصولی"))})
                FilterChip(!incoming,{incoming=false},label={Text(t("Cash Out / ادائیگی","نقد خرچ / ادائیگی"))})
              }
              BusinessField(amount,t("Amount (Rs.)","رقم (روپے)"),true){amount=it}
              BusinessField(note,t("Description / detail","تفصیل / وضاحت")){note=it}
              BusinessField(dateText,t("Entry date (YYYY-MM-DD)","اندراج کی تاریخ (سال-مہینہ-دن)")){dateText=it}
              BusinessChoice(state.accounts.find { it.id==accountId }?.name ?: "",t("Cash / bank account","کیش / بینک اکاؤنٹ"),state.accounts.map { it.name }) { name -> accountId=state.accounts.first { it.name==name }.id }
              if(error.isNotBlank()) Text(error,color=MaterialTheme.colorScheme.error)
            }
          }
          '''
          ui.write_text(s,encoding="utf-8")
          print("Added dated Roznamcha cash-in/out with account balance posting, filters, totals and distinct Khata accent.")
          PY
      - name: Archive final patched Android source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          zip -qr "$GITHUB_WORKSPACE/ArshadFinance-4.9.0-final-source.zip" app/src/main/java app/src/main/res app/src/test app/build.gradle.kts settings.gradle.kts gradle/libs.versions.toml

      - name: Upload final patched Android source
        uses: actions/upload-artifact@v4
        with:
          name: ArshadFinance-4.9.0-source
          path: ArshadFinance-4.9.0-final-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and required packages
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Restore persistent signing key for future APK updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: arshad-finance-standalone-signing-v1

      - name: Create signing key once when cache is empty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [[ ! -f ~/.android/debug.keystore ]]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Arshad Finance, O=Arshad Finance, C=PK"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Run unit tests (required for APK delivery)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p "$PROJECT_DIR/dist"
          # Re-sign with both legacy JAR (v1) and modern APK (v2) schemes.
          # Keep the persistent CI keystore so subsequent standalone builds retain identity.
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out "$PROJECT_DIR/dist/ArshadFinance-4.9.0.apk" "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$PROJECT_DIR/dist/ArshadFinance-4.9.0.apk" > "$PROJECT_DIR/dist/signature-check.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$PROJECT_DIR/dist/ArshadFinance-4.9.0.apk" > "$PROJECT_DIR/dist/package-info.txt"
          (cd "$PROJECT_DIR/dist" && sha256sum "ArshadFinance-4.9.0.apk" > "SHA256SUMS.txt")
          cat "$PROJECT_DIR/dist/signature-check.txt"
          head -n 3 "$PROJECT_DIR/dist/package-info.txt"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: ArshadFinance-4.9.0-APK
          path: ${{ env.PROJECT_DIR }}/dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArshadFinance-4.9.0-test-reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/tests/
            ${{ env.PROJECT_DIR }}/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
