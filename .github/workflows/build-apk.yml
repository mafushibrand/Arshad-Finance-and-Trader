name: Build Arshad Finance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q 'ArshadFinance-4.6.0-category-demo-source(1).zip' -d source
          PROJECT_DIR="$(find source -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"
          grep -RInE 'compileSdk|targetSdk|distributionUrl' "$PROJECT_DIR" --include='*.gradle.kts' --include='gradle-wrapper.properties' --include='libs.versions.toml' || true

      - name: Apply stock safety and unified POS catalogue fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-functional-fixes.py" "$PROJECT_DIR"

      - name: Allow service items in held POS carts
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-service-draft-fix.py" "$PROJECT_DIR"

      - name: Add stock and service POS regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-stock-pos-regression-tests.py" "$PROJECT_DIR"

      - name: Fix POS checkout language parameter
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/fix-pos-checkout-language-param.py" "$PROJECT_DIR"

      - name: Apply Urdu and English dashboard and receipt labels
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-language-fixes.py" "$PROJECT_DIR"


      - name: Localize recent activity and correct stale version labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])

          def patch(rel, pairs):
              p = root / rel
              s = p.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in s:
                      if new in s:
                          continue
                      raise SystemExit(f"Expected UI fragment missing in {rel}: {old[:80]}")
                  s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")

          card = root / "app/src/main/java/com/example/ui/components/TransactionItemCard.kt"
          s = card.read_text(encoding="utf-8")
          if "isUrdu: Boolean = false" not in s:
              s = s.replace("  modifier: Modifier = Modifier\n) {\n  val isIncome",
                            "  modifier: Modifier = Modifier,\n  isUrdu: Boolean = false\n) {\n  val isIncome", 1)
          s = s.replace("  val formattedTime = formatTransactionDate(transaction.dateMillis)\n",
                        "  val formattedTime = formatTransactionDate(transaction.dateMillis, isUrdu)\n"
                        "  val displayTitle = localizedTransactionTitle(transaction.title, isUrdu)\n"
                        "  val displayAccount = localizedPaymentLabel(transaction.accountName, isUrdu)\n"
                        "  val displayMethod = localizedPaymentLabel(transaction.paymentMethod, isUrdu)\n", 1)
          s = s.replace("text = transaction.title,", "text = displayTitle,", 1)
          s = s.replace('text = "$formattedTime • ${transaction.accountName}",',
                        'text = formattedTime + " • " + displayAccount,', 1)
          s = s.replace("text = transaction.paymentMethod,", "text = displayMethod,", 1)
          s = s.replace('text = "📸 Proof",',
                        'text = if (isUrdu) "📸 ثبوت" else "📸 Proof",', 1)
          helper_start = s.find("private fun formatTransactionDate(")
          if helper_start >= 0 and "private fun localizedTransactionTitle(" not in s:
              s = s[:helper_start] + """private fun localizedTransactionTitle(value: String, isUrdu: Boolean): String {
                if (!isUrdu) return value
                val mappings = listOf(
                  "Customer Bill:" to "کسٹمر بل:",
                  "Stock Purchase:" to "اسٹاک کی خریداری:",
                  "Opening balance receipt:" to "ابتدائی بیلنس کی وصولی:",
                  "Khata collection" to "کھاتے کی وصولی",
                  "Expense:" to "اخراجات:",
                  "Income:" to "آمدن:"
                )
                val match = mappings.firstOrNull { value.startsWith(it.first, ignoreCase = true) }
                return if (match != null) match.second + value.removePrefix(match.first) else value
              }

              private fun localizedPaymentLabel(value: String, isUrdu: Boolean): String {
                if (!isUrdu) return value
                return when (value.trim().lowercase(Locale.ROOT)) {
                  "cash" -> "نقد"
                  "bank" -> "بینک"
                  "jazzcash" -> "جاز کیش"
                  "easypaisa" -> "ایزی پیسہ"
                  "card" -> "کارڈ"
                  "online" -> "آن لائن"
                  else -> value
                }
              }

              private fun formatTransactionDate(timeMillis: Long, isUrdu: Boolean): String {
                val now = System.currentTimeMillis()
                val diff = now - timeMillis
                val oneDay = 86400_000L
                val locale = if (isUrdu) Locale("ur", "PK") else Locale.getDefault()
                return when {
                  diff < oneDay && diff >= 0 -> {
                    val timeFormat = SimpleDateFormat("h:mm a", locale)
                    (if (isUrdu) "آج، " else "Today, ") + timeFormat.format(Date(timeMillis))
                  }
                  diff < 2 * oneDay && diff >= oneDay -> if (isUrdu) "کل" else "Yesterday"
                  else -> SimpleDateFormat("d MMM yyyy", locale).format(Date(timeMillis))
                }
              }
              """
          elif "private fun formatTransactionDate(timeMillis: Long, isUrdu: Boolean)" not in s:
              raise SystemExit("Transaction date formatter shape changed")
          card.write_text(s, encoding="utf-8")

          patch("app/src/main/java/com/example/ui/screens/HomeScreen.kt", [
            ("          onClick = { onTransactionClick(tx) }\n        )",
             "          onClick = { onTransactionClick(tx) },\n          isUrdu = isUrdu\n        )")
          ])
          patch("app/src/main/java/com/example/ui/screens/BusinessHomeScreen.kt", [
            ("TransactionItemCard(tx, uiState.currencySymbol, { onTransactionClick(tx) })",
             "TransactionItemCard(tx, uiState.currencySymbol, { onTransactionClick(tx) }, isUrdu = urdu)")
          ])
          patch("app/src/main/java/com/example/ui/screens/StatsScreen.kt", [
            ("import com.example.data.model.TransactionType\n",
             "import com.example.data.model.TransactionType\nimport com.example.data.model.AppLanguage\n"),
            ("        onClick = { onTransactionClick(tx) }\n      )",
             "        onClick = { onTransactionClick(tx) },\n        isUrdu = uiState.appLanguage == AppLanguage.URDU\n      )")
          ])
          patch("app/src/main/java/com/example/ui/screens/SettingsScreen.kt", [
            ('text = "APP VERSION & APK UPDATE (ورژن 2.7.0)"',
             'text = if (isUrdu) "ایپ ورژن اور APK اپ ڈیٹ" else "APP VERSION & APK UPDATE"'),
            ('text = "Arshad Finance V3.2.0"', 'text = "Arshad Finance"'),
            ('text = "LATEST ✓"', 'text = if (isUrdu) "تازہ ترین ✓" else "LATEST ✓"'),
            ('text = "Build 33 • Login, Mode Switcher, FBR Statements & Plans"',
             'text = if (isUrdu) "لاگ اِن، بزنس موڈ، FBR اسٹیٹمنٹ اور پلانز" else "Login, Business Modes, FBR Statements & Plans"'),
            ('text = "تازہ ترین اپ ڈیٹ (What\'s New in V3.2.0):"',
             'text = if (isUrdu) "نئی تبدیلیاں" else "What\'s New"'),
            ('text = "Download APK / Update Guide (تازہ ترین APK ڈاؤنلوڈ کریں)"',
             'text = if (isUrdu) "تازہ ترین APK ڈاؤنلوڈ / اپ ڈیٹ گائیڈ" else "Download APK / Update Guide"'),
            ('text = "Arshad Finance & Traders V2.7.0"', 'text = "Arshad Finance & Traders"'),
            ('text = "All-in-One POS, Billing, Multi-Role & Subscription Khata"',
             'text = if (isUrdu) "مکمل POS، بلنگ، متعدد صارفین اور سبسکرپشن کھاتہ" else "All-in-One POS, Billing, Multi-Role & Subscription Khata"'),
            ('Text(if (isUrdu) "تازہ ترین APK ڈاؤنلوڈ (ورژن 3.3.0)" else "Download Latest Version APK (v3.3.0)"',
             'Text(if (isUrdu) "تازہ ترین APK ڈاؤنلوڈ" else "Download Latest Version APK"')
          ])
          print("Localized recent activity and removed stale duplicate version labels.")
          PY

      - name: Apply selected-language thermal receipt preview
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-thermal-preview-language.py" "$PROJECT_DIR"

      - name: Fix Compose ListTile trailing-lambda parameter order
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/java/com/example/ui/screens/PremiumInventoryScreen.kt" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          old = """internal fun ListTile(title: String, subtitle: String, icon: ImageVector, trailing: String = "",
            tint: Color = Mint, click: () -> Unit = {}, controls: @Composable RowScope.() -> Unit = {},
            leadingEmoji: String = "") {"""
          new = """internal fun ListTile(title: String, subtitle: String, icon: ImageVector, trailing: String = "",
            tint: Color = Mint, click: () -> Unit = {}, leadingEmoji: String = "",
            controls: @Composable RowScope.() -> Unit = {}) {"""
          if old not in source:
              if new in source:
                  print("ListTile signature already fixed")
              else:
                  raise SystemExit("Expected ListTile signature not found; refusing unsafe patch")
          else:
              path.write_text(source.replace(old, new, 1))
              print("Fixed ListTile parameter order")
          PY

      - name: Give standalone APK a separate package identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          replacements = {
              'applicationId = "com.aistudio.arshadfinance.v2stock"': 'applicationId = "com.aistudio.arshadfinance.v2stock.standalone"',
              'versionCode = 45': 'versionCode = 46',
              'versionName = "4.6.0-plans"': 'versionName = "4.6.0-standalone"',
              'manifestPlaceholders["appLabel"] = "@string/app_name"': 'manifestPlaceholders["appLabel"] = "Arshad Finance Standalone"',
          }
          for before, after in replacements.items():
              if before not in s:
                  raise SystemExit(f"Expected build setting not found: {before}")
              s = s.replace(before, after, 1)
          p.write_text(s)
          print("Standalone package, version and launcher label configured")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and required packages
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Run unit tests (report failures without blocking APK delivery)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p "$PROJECT_DIR/dist"
          cp "$APK" "$PROJECT_DIR/dist/ArshadFinance-4.6.0-Standalone.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$PROJECT_DIR/dist/ArshadFinance-4.6.0-Standalone.apk" > "$PROJECT_DIR/dist/signature-check.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$PROJECT_DIR/dist/ArshadFinance-4.6.0-Standalone.apk" > "$PROJECT_DIR/dist/package-info.txt"
          sha256sum "$PROJECT_DIR/dist/ArshadFinance-4.6.0-Standalone.apk" > "$PROJECT_DIR/dist/SHA256SUMS.txt"
          cat "$PROJECT_DIR/dist/signature-check.txt"
          head -n 3 "$PROJECT_DIR/dist/package-info.txt"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: ArshadFinance-4.6.0-Standalone-APK
          path: ${{ env.PROJECT_DIR }}/dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArshadFinance-test-reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/tests/
            ${{ env.PROJECT_DIR }}/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
