name: Build Arshad Finance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q 'ArshadFinance-4.6.0-category-demo-source(1).zip' -d source
          PROJECT_DIR="$(find source -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"
          grep -RInE 'compileSdk|targetSdk|distributionUrl' "$PROJECT_DIR" --include='*.gradle.kts' --include='gradle-wrapper.properties' --include='libs.versions.toml' || true

      - name: Archive extracted source for complete catalogue implementation
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          zip -qr "$GITHUB_WORKSPACE/extracted-source-review.zip" app/src/main/java app/src/main/res app/src/test app/build.gradle.kts settings.gradle.kts gradle/libs.versions.toml 2>/dev/null || true

      - name: Upload extracted source review
        uses: actions/upload-artifact@v4
        with:
          name: ArshadFinance-extracted-source-review
          path: extracted-source-review.zip
          if-no-files-found: error
          retention-days: 7

      - name: Inspect home navigation and business categories
        shell: bash
        run: |
          set -euo pipefail
          echo '--- BusinessHomeScreen category and service references ---'
          grep -n -i -C 3 -E 'service|category|FinanceTab|bottom|NavigationBarItem' "$PROJECT_DIR/app/src/main/java/com/example/ui/screens/BusinessHomeScreen.kt" || true
          echo '--- MainActivity navigation references ---'
          grep -n -i -C 3 -E 'FinanceTab|service|NavigationBarItem|bottomNavigation|NavigationBar' "$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt" || true
          echo '--- Navigation source files ---'
          grep -RIl 'enum class FinanceTab\|sealed.*FinanceTab\|FinanceTab.SERVICES' "$PROJECT_DIR/app/src/main/java" || true

      - name: Apply stock safety and unified POS catalogue fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-functional-fixes.py" "$PROJECT_DIR"

      - name: Allow service items in held POS carts
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-service-draft-fix.py" "$PROJECT_DIR"

      - name: Add stock and service POS regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-stock-pos-regression-tests.py" "$PROJECT_DIR"

      - name: Fix POS checkout language parameter
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/fix-pos-checkout-language-param.py" "$PROJECT_DIR"

      - name: Apply Urdu and English dashboard and receipt labels
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-language-fixes.py" "$PROJECT_DIR"

      - name: Correct stale and mixed-language app version labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1]) / "app/src/main/java/com/example/ui/screens/SettingsScreen.kt"
          s = p.read_text(encoding="utf-8")
          pairs = [
            ('text = "APP VERSION & APK UPDATE (ورژن 2.7.0)"',
             'text = if (isUrdu) "ایپ ورژن اور APK اپ ڈیٹ" else "APP VERSION & APK UPDATE"'),
            ('text = "Arshad Finance V3.2.0"', 'text = "Arshad Finance"'),
            ('text = "LATEST ✓"', 'text = if (isUrdu) "تازہ ترین ✓" else "LATEST ✓"'),
            ('text = "Build 33 • Login, Mode Switcher, FBR Statements & Plans"',
             'text = if (isUrdu) "لاگ اِن، بزنس موڈ، FBR اسٹیٹمنٹ اور پلانز" else "Login, Business Modes, FBR Statements & Plans"'),
            ('text = "تازہ ترین اپ ڈیٹ (What\'s New in V3.2.0):"',
             'text = if (isUrdu) "نئی تبدیلیاں" else "What\'s New"'),
            ('text = "Download APK / Update Guide (تازہ ترین APK ڈاؤنلوڈ کریں)"',
             'text = if (isUrdu) "تازہ ترین APK ڈاؤنلوڈ / اپ ڈیٹ گائیڈ" else "Download APK / Update Guide"'),
            ('text = "Arshad Finance & Traders V2.7.0"', 'text = "Arshad Finance & Traders"'),
            ('text = "All-in-One POS, Billing, Multi-Role & Subscription Khata"',
             'text = if (isUrdu) "مکمل POS، بلنگ، متعدد صارفین اور سبسکرپشن کھاتہ" else "All-in-One POS, Billing, Multi-Role & Subscription Khata"'),
            ('Text(if (isUrdu) "تازہ ترین APK ڈاؤنلوڈ (ورژن 3.3.0)" else "Download Latest Version APK (v3.3.0)"',
             'Text(if (isUrdu) "تازہ ترین APK ڈاؤنلوڈ" else "Download Latest Version APK"')
          ]
          for old, new in pairs:
              if old not in s:
                  if new in s:
                      continue
                  raise SystemExit("Expected old version label not found: " + old[:75])
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          print("Removed obsolete version labels and localized settings labels.")
          PY

      - name: Apply selected-language thermal receipt preview
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-thermal-preview-language.py" "$PROJECT_DIR"

      - name: Fix Compose ListTile trailing-lambda parameter order
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/java/com/example/ui/screens/PremiumInventoryScreen.kt" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          old = """internal fun ListTile(title: String, subtitle: String, icon: ImageVector, trailing: String = "",
            tint: Color = Mint, click: () -> Unit = {}, controls: @Composable RowScope.() -> Unit = {},
            leadingEmoji: String = "") {"""
          new = """internal fun ListTile(title: String, subtitle: String, icon: ImageVector, trailing: String = "",
            tint: Color = Mint, click: () -> Unit = {}, leadingEmoji: String = "",
            controls: @Composable RowScope.() -> Unit = {}) {"""
          if old not in source:
              if new in source:
                  print("ListTile signature already fixed")
              else:
                  raise SystemExit("Expected ListTile signature not found; refusing unsafe patch")
          else:
              path.write_text(source.replace(old, new, 1))
              print("Fixed ListTile parameter order")
          PY

      - name: Give standalone APK a fresh package identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          replacements = {
              'applicationId = "com.aistudio.arshadfinance.v2stock"': 'applicationId = "com.aistudio.arshadfinance.v2stock.standalone5"',
              'versionCode = 45': 'versionCode = 55',
              'versionName = "4.6.0-plans"': 'versionName = "4.7.0"',
              'manifestPlaceholders["appLabel"] = "@string/app_name"': 'manifestPlaceholders["appLabel"] = "Arshad Finance"',
          }
          for before, after in replacements.items():
              if before not in s:
                  raise SystemExit(f"Expected build setting not found: {before}")
              s = s.replace(before, after, 1)
          p.write_text(s)
          print("Configured fresh standalone5 package, version 4.7.0")
          PY

      - name: Fix trial header and demo catalogue test failures
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-test-failure-fixes.py" "$PROJECT_DIR"

      - name: Add bilingual auto-sliding home promotional banners
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-home-showcase.py" "$PROJECT_DIR"

      - name: Add editable product, service, business logo and banner images
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-multi-business-customization.py" "$PROJECT_DIR"

      - name: Bundle HD demo photos for promotional slider
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/add-demo-promo-assets.py" "$PROJECT_DIR"

      - name: Build dynamic storefront and owner-managed catalogue
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-dynamic-home.py" "$PROJECT_DIR"

      - name: Add ten storefront departments and remove duplicate Home shortcuts
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-storefront-departments.py" "$PROJECT_DIR"

      - name: Fix demo storefront products, category CRUD and Finance More tab
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-catalogue-crud-more.py" "$PROJECT_DIR"

      - name: Populate all retail departments with HD demo products
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-demo-storefront-catalog.py" "$PROJECT_DIR"

      - name: Add Home slider management, special offers, demo toggle and Catalog-only Services
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-home-controls.py" "$PROJECT_DIR"

      - name: Move slider controls to More and add unlimited image-first slide management
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-promo-manager.py" "$PROJECT_DIR"

      - name: Correct Home slider and Urdu promo regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/fix-home-promo-regression-tests.py" "$PROJECT_DIR"

      - name: Archive final patched Android source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          zip -qr "$GITHUB_WORKSPACE/ArshadFinance-4.7.0-final-source.zip" app/src/main/java app/src/main/res app/src/test app/build.gradle.kts settings.gradle.kts gradle/libs.versions.toml

      - name: Upload final patched Android source
        uses: actions/upload-artifact@v4
        with:
          name: ArshadFinance-4.7.0-source
          path: ArshadFinance-4.7.0-final-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and required packages
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Restore persistent signing key for future APK updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: arshad-finance-standalone-signing-v1

      - name: Create signing key once when cache is empty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [[ ! -f ~/.android/debug.keystore ]]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Arshad Finance, O=Arshad Finance, C=PK"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Run unit tests (required for APK delivery)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p "$PROJECT_DIR/dist"
          # Re-sign with both legacy JAR (v1) and modern APK (v2) schemes.
          # Keep the persistent CI keystore so subsequent standalone builds retain identity.
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out "$PROJECT_DIR/dist/ArshadFinance-4.7.0.apk" "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$PROJECT_DIR/dist/ArshadFinance-4.7.0.apk" > "$PROJECT_DIR/dist/signature-check.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$PROJECT_DIR/dist/ArshadFinance-4.7.0.apk" > "$PROJECT_DIR/dist/package-info.txt"
          sha256sum "$PROJECT_DIR/dist/ArshadFinance-4.7.0.apk" > "$PROJECT_DIR/dist/SHA256SUMS.txt"
          cat "$PROJECT_DIR/dist/signature-check.txt"
          head -n 3 "$PROJECT_DIR/dist/package-info.txt"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: ArshadFinance-4.7.0-APK
          path: ${{ env.PROJECT_DIR }}/dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArshadFinance-4.7.0-test-reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/tests/
            ${{ env.PROJECT_DIR }}/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
