name: Build Arshad Finance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q 'ArshadFinance-4.6.0-category-demo-source(1).zip' -d source
          PROJECT_DIR="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo 'Could not locate Gradle settings file in source ZIP.'
            find source -maxdepth 4 -type f | head -n 150
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"
          echo "---- Android/Gradle configuration ----"
          find "$PROJECT_DIR" -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradle.properties' \) -print
          grep -RInE 'compileSdk|targetSdk|com.android.tools.build:gradle|com.android.application|distributionUrl' "$PROJECT_DIR" --include='*.gradle' --include='*.gradle.kts' --include='gradle-wrapper.properties' --include='libs.versions.toml' || true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArshadFinance-debug-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14